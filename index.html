<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e11d48">
  <meta name="description" content="CrimsonTV — Watch live TV channels free. Premium IPTV experience.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>CrimsonTV — Live TV</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ════════════ AUTH OVERLAY ════════════ -->
  <div id="authOverlay">
    <div class="auth-box">
      <div class="auth-logo">
        <div class="auth-logo-icon">C</div>
        <h1>Crimson<span>TV</span></h1>
        <p>Premium Live Television</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Sign In</button>
        <button class="auth-tab" data-tab="register">Register</button>
      </div>

      <div class="auth-error" id="authError"></div>

      <form id="loginForm">
        <div class="auth-field">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" id="loginPass" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="auth-btn" id="loginBtn">Sign In</button>
      </form>

      <form id="registerForm" style="display:none">
        <div class="auth-field">
          <label>Name</label>
          <input type="text" id="regName" placeholder="Your name" autocomplete="name">
        </div>
        <div class="auth-field">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" id="regPass" placeholder="Min 6 characters" required autocomplete="new-password">
        </div>
        <button type="submit" class="auth-btn" id="regBtn">Create Account</button>
      </form>

      <div class="auth-divider">or</div>

      <button class="google-btn" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.5-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.3 36 26.8 37 24 37c-5.3 0-9.7-3.3-11.3-8H6.3C9.6 39.7 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-3.5 5.7-6.5 7.1l6.2 5.2C38.5 36.8 44 31.2 44 24c0-1.3-.1-2.5-.4-3.5z"/></svg>
        Continue with Google
      </button>

      <span class="skip-auth" id="skipAuth">Continue without login →</span>
    </div>
  </div>

  <!-- ════════════ MAIN APP ════════════ -->
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">C</div>
        Crimson<span>TV</span>
      </div>

      <div class="search-wrap" id="searchWrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search channels..." autocomplete="off">
        <button class="search-clear" id="searchClear" title="Clear"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="user-area" id="userArea"></div>
    </header>

    <!-- Desktop Leaderboard 728x90 -->
    <div class="ad-slot ad-desktop ad-leaderboard" id="ad728"></div>

    <div class="main">
      <section class="player-section">
        <div class="v-wrap" id="vWrap">
          <video id="video" playsinline webkit-playsinline></video>
          <div class="player-overlay" id="playerOverlay"></div>

          <button class="big-play" id="bigPlay" title="Play">
            <i class="fa-solid fa-play"></i>
          </button>

          <div class="pc-bar" id="pcBar">
            <div class="pc-top">
              <div class="pc-info">
                <div class="pc-name" id="pcName">Select a channel</div>
                <div class="pc-meta" id="pcMeta"></div>
              </div>
              <div class="pc-actions">
                <button class="pc-btn" id="btnShare" title="Share">
                  <i class="fa-solid fa-share-nodes"></i>
                </button>
                <button class="pc-btn" id="btnPip" title="Picture in Picture">
                  <i class="fa-solid fa-window-restore"></i>
                </button>
              </div>
            </div>

            <div class="pc-bottom">
              <div class="pc-btns left">
                <button class="pc-btn" id="btnPrev" title="Previous Channel">
                  <i class="fa-solid fa-backward-step"></i>
                </button>
                <button class="pc-btn main-btn" id="btnPlay" title="Play/Pause">
                  <i class="fa-solid fa-play"></i>
                </button>
                <button class="pc-btn" id="btnNext" title="Next Channel">
                  <i class="fa-solid fa-forward-step"></i>
                </button>
              </div>

              <div class="vol-wrap">
                <button class="pc-btn" id="btnMute" title="Mute">
                  <i class="fa-solid fa-volume-high"></i>
                </button>
                <input type="range" id="volSlider" class="vol-slider" min="0" max="1" step="0.05" value="1" title="Volume">
              </div>

              <div class="pc-btns right">
                <button class="pc-btn" id="btnFs" title="Fullscreen">
                  <i class="fa-solid fa-expand"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="channel-section">
        <div class="cat-tabs" id="catTabs"></div>

        <div class="ch-scroll">
          <div class="ch-grid" id="chGrid"></div>
        </div>
      </section>
    </div>

    <nav class="bottom-nav" id="bottomNav">
      <div class="bn-item active" data-page="home">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </div>
      <div class="bn-item" data-page="fav">
        <i class="fa-solid fa-heart"></i>
        <span>Favorites</span>
      </div>
      <div class="bn-item" data-page="recent">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>Recent</span>
      </div>
      <div class="bn-item" data-page="search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>Search</span>
      </div>
    </nav>
  </div>

  <div class="mobile-search-overlay" id="mobileSearchOverlay">
    <div class="ms-header">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="mobileSearchInput" placeholder="Search channels..." autocomplete="off">
      <button id="mobileSearchClose"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
